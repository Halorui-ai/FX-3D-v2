<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>富士康郑州厂区 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e8eef5}
  canvas{display:block}
  .panel{position:fixed;background:rgba(14,20,28,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #ctl{left:14px;top:14px;width:268px}
  #ctl h1{font-size:15px;margin:0 0 2px;font-weight:600;letter-spacing:.5px}
  #ctl .sub{color:#8fa3b8;font-size:11.5px;margin-bottom:10px}
  .row{margin:9px 0 3px;color:#9fb2c6;font-size:11.5px;display:flex;justify-content:space-between;align-items:center}
  .btns{display:flex;flex-wrap:wrap;gap:5px}
  button{background:rgba(255,255,255,.07);color:#e8eef5;border:1px solid rgba(255,255,255,.13);border-radius:6px;padding:4px 9px;font-size:12.5px;cursor:pointer;font-family:inherit}
  button:hover{background:rgba(255,255,255,.16)} button.on{background:#2f7fd6;border-color:#58a3f2}
  input[type=range]{width:100%;accent-color:#58a3f2;margin:2px 0}
  select,input[type=text]{background:rgba(255,255,255,.07);color:#e8eef5;border:1px solid rgba(255,255,255,.13);border-radius:6px;padding:3px 6px;font-size:12.5px;font-family:inherit}
  select option{color:#111}
  label.ck{display:inline-flex;align-items:center;gap:4px;margin-right:9px;font-size:12.5px;white-space:nowrap}
  #timeLabel{font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
  #sunInfo{color:#8fa3b8;font-size:11.5px}
  #info{right:14px;top:14px;min-width:170px;display:none}
  #info h3{margin:0 0 6px;font-size:20px;color:#7fd6ff}
  #info div{margin:2px 0} .dim{color:#8fa3b8;font-size:11.5px}
  #compass{position:fixed;right:22px;bottom:22px;width:78px;height:78px;border-radius:50%;background:rgba(14,20,28,.72);border:1px solid rgba(255,255,255,.18)}
  #needle{position:absolute;inset:0;transition:transform .05s linear}
  #needle::before{content:"";position:absolute;left:50%;top:9px;margin-left:-7px;border:7px solid transparent;border-bottom:26px solid #ff5a4d}
  #needle::after{content:"";position:absolute;left:50%;bottom:9px;margin-left:-7px;border:7px solid transparent;border-top:26px solid #c9d3de}
  #needle b{position:absolute;left:0;right:0;top:-19px;text-align:center;font-size:13px;color:#ff8a80}
  #hint{left:50%;bottom:12px;transform:translateX(-50%);padding:6px 12px;font-size:11.5px;color:#9fb2c6}
  #ctlToggle{position:fixed;left:252px;top:21px;z-index:5;padding:2px 8px;font-size:14px;line-height:18px}
  body.ctl-min #ctl{display:none} body.ctl-min #ctlToggle{left:14px;top:14px;padding:6px 11px;background:rgba(14,20,28,.82)}
  #twinbar{left:50%;top:14px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:8px 14px;white-space:nowrap}
  #twinbar>b{font-size:15px;color:#7fd6ff}
  #twKpis{display:flex;gap:14px;padding:0 12px;border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14)}
  .kc{font-size:12px} .kc b{font-size:19px;margin-right:4px;font-variant-numeric:tabular-nums} .dimc{color:#8fa3b8!important;font-size:11.5px}
  #fcards{position:fixed;left:0;top:0;width:0;height:0;z-index:3}
  .fc{position:absolute;left:0;top:0;transform-origin:0 50%;width:292px;background:rgba(12,18,26,.9);border:1px solid rgba(255,255,255,.14);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.45);font-size:13px;overflow:hidden;display:none}
  .fc .fh{display:flex;align-items:center;gap:10px;padding:7px 12px;border-left:6px solid;cursor:pointer;background:rgba(255,255,255,.05)} .fc .fh:hover{background:rgba(255,255,255,.1)}
  .fc .fh b{font-size:22px;color:#fff;line-height:1} .fc .sum{display:flex;gap:10px;font-size:12.5px;font-weight:600} .fc .sum i{font-style:normal}
  .fc table{width:100%;border-collapse:collapse} .fc td{padding:5px 6px;text-align:right;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .fc td:first-child{text-align:left;font-size:14px;font-weight:600;color:#e8eef5;padding-left:12px;white-space:nowrap} .fc tr.hd td{font-size:10.5px;font-weight:400;color:#8fa3b8;padding:5px 6px 1px;white-space:nowrap}
  .fc tr[data-gate]{cursor:pointer;border-top:1px solid rgba(255,255,255,.06)} .fc tr[data-gate]:hover{background:rgba(255,255,255,.09)} .fc tr.on{background:rgba(47,127,214,.38)}
  .fc u{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;text-decoration:none} .fc em{font-style:normal;font-size:10px;color:#ffb020;margin-left:4px;font-weight:400}
  .fc.mini table{display:none} .fc.mini{width:250px}
  #twin{left:14px;top:58px;bottom:14px;width:318px;display:none;overflow-y:auto;padding:12px 14px;z-index:4}
  #twin h3{margin:0 0 2px;font-size:16px;color:#7fd6ff;word-break:break-all} #twin .bk{float:right;font-size:12px;padding:2px 8px}
  #twin .sec{margin:12px 0 4px;color:#9fb2c6;font-size:11.5px;border-left:3px solid #2f7fd6;padding-left:6px}
  #twin .kps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}
  #twin .kp{border:1px solid;border-radius:7px;padding:5px 2px 4px;text-align:center;background:rgba(255,255,255,.03)} #twin .kp b{display:block;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums} #twin .kp span{font-size:10.5px;color:#9fb2c6}
  #twin .od{display:flex;gap:6px;font-size:11.5px;padding:4px 4px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;border-radius:4px} #twin .od:hover{background:rgba(255,255,255,.09)} #twin .od.on{background:rgba(47,127,214,.38)}
  #twin .od .id{font-family:Consolas,monospace;flex:none} #twin .od .id.sp{color:#b98cff} #twin .od .fr{flex:1;color:#9fb2c6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #twin .od .ov{flex:none}
  #twin .note{margin-top:12px;font-size:10.5px;color:#6f8296}
  #trace{right:14px;bottom:14px;display:none;max-width:calc(100vw - 60px);padding:10px 14px;z-index:4}
  .trh{display:flex;align-items:center;gap:12px;font-size:12.5px;margin-bottom:9px;white-space:nowrap} .trh b{font-family:Consolas,monospace;font-size:15px;color:#fff} .trh b.sp{color:#b98cff}
  .trh .tg{background:#6a3fc0;border-radius:4px;padding:0 6px;font-size:11px} .trh .st{border:1px solid;border-radius:5px;padding:1px 8px;font-weight:600} .trh button{margin-left:auto}
  .trs{display:flex;align-items:stretch;overflow-x:auto} .trs .sp{flex:none;min-width:104px;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 9px;text-align:center;opacity:.5}
  .trs .sp.ok{opacity:1;border-color:#4fc3ff;background:rgba(79,195,255,.1)} .trs .sp.l2{border-style:dashed} .trs .sp b{display:block;font-size:13px;white-space:nowrap} .trs .sp span{display:block;font-size:10.5px;color:#9fb2c6;white-space:nowrap} .trs .sp em{display:block;font-style:normal;font-size:13px;font-variant-numeric:tabular-nums;color:#7fd6ff;margin-top:1px}
  .trs .ar{flex:none;min-width:58px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10.5px;color:#9fb2c6;padding:0 3px} .trs .ar i{display:block;width:100%;height:2px;background:rgba(255,255,255,.2);margin-top:3px} .trs .ar.ok i{background:#4fc3ff}
  body.twin-on #hint{display:none} body.twin-on #compass{display:none}
  body.noui #ctlToggle, body.twin-drawer #ctlToggle{display:none} body.twin-drawer #trace{max-width:calc(100vw - 380px)}
  body.noui .panel, body.noui #compass{display:none!important}
</style>
</head>
<body>
<div id="ctl" class="panel">
  <h1>富士康郑州综保区厂区</h1>
  <div class="sub">按卫星影像逐栋描绘 · WGS-84 · 正北朝上</div>
  <div class="row"><span>时间　<span id="timeLabel">10:00</span></span><span id="sunInfo"></span></div>
  <input id="time" type="range" min="0" max="24" step="0.1" value="10">
  <div class="btns"><button id="tDawn">清晨</button><button id="tNoon">正午</button><button id="tDusk">黄昏</button><button id="tNight">夜晚</button>
    <select id="month"><option value="0">1月</option><option value="1">2月</option><option value="2">3月</option><option value="3">4月</option><option value="4">5月</option><option value="5">6月</option><option value="6">7月</option><option value="7">8月</option><option value="8">9月</option><option value="9">10月</option><option value="10">11月</option><option value="11">12月</option></select></div>
  <div class="row">天气</div><div id="weather" class="btns"></div>
  <div class="row">视角</div><div id="views" class="btns"></div>
  <div class="row">分区</div><div id="zones" class="btns"></div>
  <div class="row">图层</div>
  <div><label class="ck"><input id="lyLabels" type="checkbox" checked>栋号</label><label class="ck"><input id="lyZones" type="checkbox" checked>分区名</label><label class="ck"><input id="lyTrees" type="checkbox" checked>树木</label><label class="ck"><input id="lyRoads" type="checkbox" checked>道路标线</label><label class="ck"><input id="lyWalls" type="checkbox" checked>围墙大门</label><label class="ck"><input id="lyCars" type="checkbox" checked>车辆</label><label class="ck"><input id="lyShadow" type="checkbox" checked>阴影</label><label class="ck"><input id="lyAO" type="checkbox" checked>环境光遮蔽</label><label class="ck"><input id="lyGrade" type="checkbox" checked>胶片调色</label><label class="ck"><input id="lyPerf" type="checkbox">性能数据</label></div>
  <div class="row">查找栋号</div><input id="search" type="text" placeholder="例如 K07，回车" style="width:150px">
</div>
<div id="info" class="panel"></div>
<button id="ctlToggle" title="收起 / 展开控制面板">☰</button>
<div id="twinbar" class="panel"><b id="twName"></b><span id="twKpis"></span><span id="twFloors" class="btns"></span><button id="twClose">✕ 收起</button></div>
<div id="fcards"></div>
<div id="trace" class="panel"></div>
<div id="twin" class="panel"></div>
<div id="perf" class="panel" style="display:none;left:50%;bottom:44px;transform:translateX(-50%);padding:5px 12px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:6">正在测量…</div>
<div id="compass"><div id="needle"><b>N</b></div></div>
<div id="hint" class="panel">左键拖动平移 · 右键拖动旋转 · 滚轮缩放 · 单击楼栋看信息 · 双击飞到楼栋</div>
<script src="app.js"></script>
</body>
</html>
